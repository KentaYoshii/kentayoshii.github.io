# Photos for /gallery/, grouped by park. Hand-maintained -- no build script,
# unlike books/movies/trails, since a photo needs no external lookup and its
# fields are already structured (see README).
#
# Add a photo by dropping the file under docs/assets/gallery/, adding an entry
# here, then regenerating the served derivatives:
#
#     python3 scripts/build_gallery_thumbs.py
#
# The page never serves the file named by `image` -- that stays as the
# full-resolution original the derivatives are rebuilt from. The grid serves
# assets/gallery/thumbs/ and the lightbox serves assets/gallery/large/, both
# generated by the script above and committed alongside it.
#
# - image: /assets/gallery/zion_1.jpeg      # required, the original
#   park: Zion                              # exact name from travel.json
#   location: Utah                          # state, for the lightbox
#   date: "2025-04-27"                      # quoted -- see below
#   caption: The Narrows, looking upstream  # optional
#   tags: [canyon, water]                   # optional
#
# Quote the date. Unquoted, a real YAML parser turns it into a date object
# while scripts/gallery_data.py leaves it a string, and the two readers of
# this file then disagree about the type. There is a test for that.
#
# `park` is what groups the page into sections and what joins a photo to its
# entry on /adventure/, so it must match the park's name in
# docs/_data/travel.json character for character -- several differ from the
# everyday spelling ("White Sands", "Rocky Mountain", "Hawaiʻi Volcanoes").
# Omit `park` for somewhere that is not a national park; those collect into a
# closing "Elsewhere" section.
#
# Section order follows first appearance below: most recent visit first, and
# within a year the parks with the most photos first.
#
# Every `date` below was read out of the photo's own EXIF, so they are the
# days the shutter actually fired rather than anything typed in. The lightbox
# shows the date where there is one and the park's visit year otherwise.
#
# `caption` and `tags` are optional and mostly unset: nothing is recorded
# about what these photographs show, and a guess would read as fact. A photo
# without a caption still renders -- the template falls back to the park name
# for its alt text -- so they can be filled in whenever there is something
# real to say.

