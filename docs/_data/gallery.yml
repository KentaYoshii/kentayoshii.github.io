# Photos for /gallery/, newest first. Hand-maintained — no build script,
# unlike books.json/movies.json/trails.json, since a photo needs no external
# lookup and its fields are already structured (see README).
#
# Add a photo by dropping the file under docs/assets/gallery/ and adding an
# entry here:
#
# - image: /assets/gallery/2026-06-yosemite-valley.jpg
#   caption: Tunnel View at sunrise
#   date: 2026-06-14
#   location: Yosemite National Park, CA
#   tags: [landscape, national-park]
#
# `tags` is optional — an untagged photo still shows in the grid, just
# without any chips pointing at it.
#

