# Photos for /adventure/parks/, grouped by park. Hand-maintained -- no build
# script, unlike books/movies/trails, since a photo needs no external lookup
# and its fields are already structured (see README).
#
# Add a photo by dropping the file under photo-originals/, adding an entry
# here, then regenerating the served derivatives:
#
#     python3 scripts/build_gallery_thumbs.py
#
# `image` names a file in photo-originals/, which is outside docs/ and so is
# never published -- it is the full-resolution source the derivatives are
# rebuilt from, and nothing links to it. What the page loads is
# assets/gallery/thumbs/ for the grid and assets/gallery/large/ for the
# lightbox, both generated by the script above and committed alongside it.
#
# - image: zion_1.jpeg                      # required, the original
#   park: Zion                              # exact name from travel.json
#   location: Utah                          # state, for the lightbox
#   date: "2025-04-27"                      # quoted -- see below
#   caption: The canyon from the overlook   # optional
#   tags: [canyon, clouds]                  # optional
#
# Quote the date. Unquoted, a real YAML parser turns it into a date object
# while scripts/gallery_data.py leaves it a string, and the two readers of
# this file then disagree about the type. There is a test for that.
#
# `park` is what groups the page into sections and what joins a photo to its
# entry on /adventure/parks/, so it must match the park's name in
# docs/_data/travel.json character for character -- several differ from the
# everyday spelling ("White Sands", "Rocky Mountain", "Hawaiʻi Volcanoes").
# Omit `park` for somewhere that is not a national park; those collect into a
# closing "Elsewhere" section.
#
# Section order follows first appearance below: most recent visit first, and
# within a year the parks with the most photos first.
#
# Every `date` was read out of the photo's own EXIF, so they are the days the
# shutter actually fired rather than anything typed in. A photo with no
# `date` had none in its file (an edited export, say); the page falls back
# to the park's visit year.
#
# Captions describe what is in the frame. Where a landmark is not identifiable
# with certainty, the caption says what is visible instead of naming it.

