name: fetch

# The one job that is allowed to touch the network, run by hand.
#
# build_covers.py and build_trails.py are offline by default so that build.py
# and the `build` workflow stay deterministic; filling their caches needs an
# online --fetch pass. Doing that here rather than on a laptop means it runs
# on a clean network with a clean trust store: a corporate TLS-inspection root
# CA is enough to make Python reject Open Library outright, and some networks
# block it entirely.
#
# Deliberately not on: push. These call donated infrastructure (Open Library,
# Overpass), so they run when there is something new to look up, not on every
# commit. The `build` workflow tells you when that is — it reports unresolved
# entries.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to look up
        type: choice
        default: all
        options: [all, covers, trails]

# A second run while one is mid-flight would race on the same files and push a
# conflicting commit. Queue instead, and never cancel: an interrupted run
# loses whatever it had resolved but not yet checkpointed.
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: resolve and commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Needed to push the regenerated data back. Everything else stays read.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # continue-on-error, because a partial result is worth keeping: both
      # scripts checkpoint their cache as they go and exit non-zero if the
      # network gives out, so committing what resolved and re-running later is
      # strictly better than throwing it away. The job is failed at the end.
      - name: Look up missing covers
        id: covers
        if: inputs.target == 'all' || inputs.target == 'covers'
        continue-on-error: true
        env:
          # Optional. Films are already cached; without this the script skips
          # them with a notice and still resolves books.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/build_covers.py --fetch

      - name: Look up missing trails
        id: trails
        if: inputs.target == 'all' || inputs.target == 'trails'
        continue-on-error: true
        run: python3 scripts/build_trails.py --fetch

      # The caches are only half the story: the offline pass is what writes
      # the resolved URLs and tags onto the records the pages actually render.
      - name: Regenerate everything
        run: python3 scripts/build.py

      - name: Commit the result
        id: commit
        run: |
          # Stage before testing: a plain `git diff` sees only tracked files,
          # so the first run after a script starts writing a new data file
          # would report "nothing new" and silently drop it.
          git add docs/_data
          if git diff --staged --quiet -- docs/_data; then
            echo "Nothing new resolved; leaving the tree alone."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Separate -m flags rather than one multi-line string: a newline
          # inside the YAML block would carry this step's indentation into the
          # commit body.
          git commit \
            -m "Resolve outstanding covers and trails" \
            -m "Ran the --fetch passes on a runner, since the APIs are not reachable from every network. Generated data only."
          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed."

      # Pushing with GITHUB_TOKEN deliberately does not trigger the `build`
      # workflow, so nothing re-checks this commit automatically. The data was
      # just regenerated by the same script that workflow compares against, so
      # the check would pass by construction anyway.
      - name: Report
        run: |
          echo "covers: ${{ steps.covers.outcome || 'skipped' }}"
          echo "trails: ${{ steps.trails.outcome || 'skipped' }}"
          if [ "${{ steps.covers.outcome }}" = "failure" ] || \
             [ "${{ steps.trails.outcome }}" = "failure" ]; then
            echo "::error::A lookup did not finish. Whatever resolved was committed; run this again to continue."
            exit 1
          fi
